name: Release

# Builds and publishes a versioned release, and only that: a push to main builds nothing.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag has to name a commit already on main; a tag pushed on any other commit fails the run
# before anything is built. GitHub's /releases/latest resolves to the newest release, so a link
# that goes through it always downloads the newest tag:
#   https://github.com/ValerioMC/penna/releases/latest/download/Penna-macos-arm64.dmg
#
# Asset:
#   Penna-macos-arm64.dmg   Penna.app (Tauri), Apple Silicon, signed ad hoc
#
# The disk image carries no version in its name, because it is the asset a link off-site points
# at and a name that moves would defeat that. The tag's version (v0.1.1 -> 0.1.1) replaces the
# one in tauri.conf.json, so the app reports the version of the release it came from.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME names $GITHUB_SHA, which is not on main."
            exit 1
          fi

      - name: Resolve the release this run publishes
        id: target
        run: |
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # No signing identity is set, so Tauri signs the bundle ad hoc. The identity `make dmg` uses
      # lives in a developer's keychain and does not exist on the runner.
      - name: Bundle Penna.app into a disk image
        run: cargo tauri build --bundles dmg --config "{\"version\":\"$PENNA_VERSION\"}"
        env:
          PENNA_VERSION: ${{ steps.target.outputs.version }}

      # The name Tauri writes carries the version and the architecture, so the file is found by
      # pattern rather than by guessing that string.
      - name: Locate disk image
        id: dmg
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$dmg" ]; then
            echo "no disk image under src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          cp "$dmg" "Penna-macos-arm64.dmg"
          echo "Built $(basename "$dmg") ($(du -h "$dmg" | cut -f1))"
          echo "path=Penna-macos-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.dmg.outputs.path }}
