[package]
name = "penna"
version = "0.1.0"
edition = "2021"
description = "Rewrite selected text in correct English using a coding agent"
license = "MIT"

[lib]
name = "penna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.7.0"
enigo = "0.6.1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
